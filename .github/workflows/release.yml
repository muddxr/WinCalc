name: Release

# Run only when a version tag like v1.0.0 is pushed
on:
  push:
    tags:
      - 'v*'

# The workflow needs write access to create a Release
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run tests (safety net)
        run: dotnet test --configuration Release

      - name: Get version number from tag
        id: version
        shell: pwsh
        run: |
          $number = "${{ github.ref_name }}".TrimStart('v')
          "number=$number" >> $env:GITHUB_OUTPUT

      - name: Publish app
        run: >
          dotnet publish src/Calculator.Winforms/Calculator.Winforms.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:Version=${{ steps.version.outputs.number }}
          --output publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath WinCalc-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          WinCalc-${{ github.ref_name }}-win-x64.zip
          --title "WinCalc ${{ github.ref_name }}"
          --generate-notes