name: CI

# WHEN to run
on:
  push:
    branches: [ main ]       # every push to main
  pull_request:
    branches: [ main ]       # every pull request targeting main
  workflow_dispatch:         # adds a manual "Run workflow" button

# WHAT to run
jobs:
  build-and-test:
    runs-on: windows-latest  # a fresh Windows VM hosted by GitHub

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json   # same SDK as your PC

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()                      # upload even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults