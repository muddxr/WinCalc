name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -f src/Calculator.Api/Dockerfile -t wincalc-api:ci .

      - name: Smoke test
        run: |
          docker run -d --rm -p 8080:8080 --name wincalc-api wincalc-api:ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/health
          curl --fail "http://localhost:8080/calculate?a=10&b=4&op=divide"
          docker stop wincalc-api
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore .NET tools                       # NEW
        run: dotnet tool restore

      - name: Restore NuGet packages
        run: dotnet restore --locked-mode

      - name: Check code formatting
        run: dotnet format --verify-no-changes --no-restore         

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage                       # CHANGED
        run: dotnet test --no-build --configuration Release --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Generate coverage report                 # NEW
        run: dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Show coverage on the run summary page    # NEW
        shell: pwsh
        run: Get-Content coverage-report/SummaryGithub.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Upload coverage report                   # NEW
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report